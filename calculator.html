<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d0c">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Video Time Sheet</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d0c;
      --surface: #111412;
      --surface-2: #171a18;
      --surface-3: #1d211e;
      --line: #2a302c;
      --line-strong: #3a423d;
      --text: #f4f6f4;
      --muted: #929b95;
      --green: #76b900;
      --green-hover: #8bd000;
      --green-bright: #9be000;
      --green-deep: #4f7c00;
      --green-soft: rgba(118, 185, 0, 0.12);
      --green-glow: rgba(118, 185, 0, 0.22);
      --danger: #ff6259;
      --panel-width: 440px;
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% -8%, rgba(118, 185, 0, 0.13), transparent 30rem),
        radial-gradient(circle at 92% 18%, rgba(118, 185, 0, 0.055), transparent 26rem),
        linear-gradient(180deg, #090b0a 0%, var(--bg) 42%, #080a09 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      height: 4px;
      background: linear-gradient(90deg, var(--green-deep), var(--green-bright) 48%, var(--green) 76%, var(--green-deep));
      box-shadow: 0 0 18px rgba(118, 185, 0, 0.48);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, #000, transparent 72%);
    }

    .cursor-light {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 15;
      width: 460px;
      height: 460px;
      pointer-events: none;
      opacity: 0;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(155, 224, 0, 0.16) 0%,
        rgba(118, 185, 0, 0.075) 30%,
        rgba(118, 185, 0, 0.025) 52%,
        transparent 72%
      );
      mix-blend-mode: screen;
      filter: blur(2px);
      will-change: transform, opacity;
      transition: opacity 220ms ease;
    }

    .visual-effects {
      position: fixed;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
      perspective: 900px;
    }

    .gpu-cube {
      --cube-size: 86px;
      position: absolute;
      width: var(--cube-size);
      height: var(--cube-size);
      transform-style: preserve-3d;
      filter: drop-shadow(0 22px 26px rgba(0, 0, 0, 0.48));
    }

    .gpu-cube span {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(155, 224, 0, 0.32);
      background:
        linear-gradient(135deg, rgba(155, 224, 0, 0.2), rgba(118, 185, 0, 0.035) 58%),
        repeating-linear-gradient(90deg, transparent 0 12px, rgba(155, 224, 0, 0.045) 12px 13px),
        rgba(12, 17, 13, 0.82);
      box-shadow: inset 0 0 24px rgba(118, 185, 0, 0.055);
      backface-visibility: hidden;
    }

    .gpu-cube .cube-front { transform: translateZ(calc(var(--cube-size) / 2)); }
    .gpu-cube .cube-right {
      transform: rotateY(90deg) translateZ(calc(var(--cube-size) / 2));
      background:
        linear-gradient(135deg, rgba(118, 185, 0, 0.12), transparent 62%),
        #0a0d0b;
    }
    .gpu-cube .cube-top {
      transform: rotateX(90deg) translateZ(calc(var(--cube-size) / 2));
      background:
        linear-gradient(145deg, rgba(155, 224, 0, 0.3), rgba(118, 185, 0, 0.06)),
        #111611;
    }

    .gpu-cube::after {
      content: "";
      position: absolute;
      top: 17%;
      left: 17%;
      width: 40%;
      height: 40%;
      z-index: 2;
      border: 1px solid rgba(190, 255, 75, 0.5);
      background: linear-gradient(135deg, var(--green-bright), var(--green-deep));
      box-shadow: 0 0 18px rgba(118, 185, 0, 0.3);
      transform: translateZ(calc((var(--cube-size) / 2) + 1px));
    }

    .gpu-cube-one {
      top: 18%;
      right: 7%;
      opacity: 0.34;
      animation: cube-float-one 8s ease-in-out infinite;
    }

    .gpu-cube-two {
      --cube-size: 58px;
      right: 4%;
      bottom: 5%;
      opacity: 0.28;
      animation: cube-float-two 10s ease-in-out infinite;
    }

    @keyframes cube-float-one {
      0%, 100% { transform: rotateX(-18deg) rotateY(34deg) rotateZ(-8deg) translateY(0); }
      50% { transform: rotateX(-12deg) rotateY(48deg) rotateZ(-2deg) translateY(-14px); }
    }

    @keyframes cube-float-two {
      0%, 100% { transform: rotateX(-22deg) rotateY(-32deg) rotateZ(10deg) translateY(0); }
      50% { transform: rotateX(-14deg) rotateY(-46deg) rotateZ(4deg) translateY(-10px); }
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      padding: 34px clamp(16px, 3vw, 44px) 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      max-width: 1500px;
      margin: 0 auto 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: block;
      flex: 0 0 auto;
      border: 1px solid rgba(194, 255, 88, 0.66);
      border-radius: 3px;
      object-fit: cover;
      box-shadow: 0 0 0 3px rgba(118, 185, 0, 0.09), 0 8px 22px rgba(118, 185, 0, 0.18);
    }

    h1 {
      margin: 0;
      font-size: clamp(21px, 3vw, 29px);
      font-weight: 780;
      line-height: 1.15;
      letter-spacing: -0.025em;
      text-shadow: 0 2px 22px rgba(255, 255, 255, 0.06);
    }

    .kicker {
      margin: 4px 0 0;
      color: #9aa69e;
      font-size: 12px;
      letter-spacing: 0.055em;
      text-transform: uppercase;
    }

    .primary-button {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 0 0 auto;
      padding: 0 15px;
      border: 1px solid var(--green-bright);
      border-radius: 3px;
      background: linear-gradient(180deg, var(--green-bright), var(--green));
      color: #090b09;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(118, 185, 0, 0.14), 0 8px 24px rgba(118, 185, 0, 0.16);
      transition: background 140ms ease, border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }

    .primary-button:hover {
      background: linear-gradient(180deg, #abef24, var(--green-hover));
      border-color: #b6f33f;
      box-shadow: 0 0 0 1px rgba(118, 185, 0, 0.2), 0 10px 30px rgba(118, 185, 0, 0.28);
    }
    .primary-button:active { transform: translateY(1px); }
    .primary-button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .primary-button .icon { font-size: 19px; line-height: 1; }
    .primary-button[hidden] { display: none; }

    .worksheet-shell {
      max-width: 1500px;
      margin: 0 auto;
      overflow-x: auto;
      border: 1px solid #303831;
      border-radius: 5px;
      background:
        linear-gradient(135deg, rgba(118, 185, 0, 0.025), transparent 34%),
        #0d100e;
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.38),
        inset 0 1px rgba(255, 255, 255, 0.025);
      scrollbar-color: #465048 #151816;
    }

    .people-grid {
      min-width: min-content;
      display: flex;
      align-items: stretch;
      gap: 18px;
      padding: 18px;
    }

    .person-panel {
      width: var(--panel-width);
      min-width: var(--panel-width);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #3c463e;
      border-radius: 5px;
      background: linear-gradient(180deg, #121613, var(--surface));
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.24);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .person-panel:hover {
      border-color: #536052;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(118, 185, 0, 0.045);
    }

    .person-toolbar {
      height: 48px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 44px 44px 44px;
      align-items: stretch;
      background:
        linear-gradient(90deg, rgba(118, 185, 0, 0.07), transparent 42%),
        linear-gradient(180deg, #252b25, #1d221e);
      border-bottom: 1px solid #4d594f;
      box-shadow: inset 0 3px 0 var(--green), inset 0 1px rgba(255, 255, 255, 0.04);
    }

    .name-input {
      min-width: 0;
      width: 100%;
      padding: 0 14px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .name-input:focus { background: rgba(118, 185, 0, 0.08); box-shadow: inset 0 -2px 0 var(--green); }

    .icon-button {
      width: 44px;
      height: 47px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-left: 1px solid #4d594f;
      background: transparent;
      color: #dbe1dc;
      font-size: 21px;
      cursor: pointer;
      transition: background 130ms ease, color 130ms ease;
    }

    .icon-button:hover { background: var(--green); color: #080a08; }
    .icon-button:focus-visible { outline: 2px solid var(--green-bright); outline-offset: -3px; }
    .delete-person:hover { background: rgba(255, 98, 89, 0.14); color: var(--danger); }

    .import-folder.is-loading {
      color: var(--green-bright);
      cursor: progress;
      animation: import-pulse 850ms ease-in-out infinite alternate;
    }

    @keyframes import-pulse {
      to { background: rgba(118, 185, 0, 0.16); }
    }

    .import-status {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 42;
      max-width: min(430px, calc(100vw - 40px));
      padding: 11px 14px;
      border: 1px solid #516052;
      border-radius: 4px;
      background: rgba(17, 21, 18, 0.97);
      color: #dce3dd;
      font-size: 12px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.42);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .import-status.is-visible { opacity: 1; transform: translateY(0); }
    .import-status.is-error { border-color: rgba(255, 98, 89, 0.65); color: #ffaaa5; }

    .table-wrap {
      flex: 1;
      overflow: auto;
      min-height: 332px;
      max-height: min(62vh, 620px);
      scrollbar-color: #465048 #151816;
    }

    table {
      width: 100%;
      border-spacing: 0;
      border-collapse: separate;
      table-layout: fixed;
    }

    col.video-col { width: 31%; }
    col.seconds-col { width: 26%; }
    col.file-col { width: auto; }
    col.delete-col { width: 36px; }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      height: 42px;
      padding: 0 11px;
      border-bottom: 1px solid #4b574d;
      background:
        linear-gradient(180deg, rgba(118, 185, 0, 0.075), transparent),
        #263028;
      color: #f7faf7;
      text-align: left;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.025em;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.44);
    }

    th + th { border-left: 1px solid #39443c; }

    .action-heading { padding: 0; }

    tbody tr { height: 43px; }
    tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.018); }
    tbody tr:hover { background: linear-gradient(90deg, rgba(118, 185, 0, 0.13), rgba(118, 185, 0, 0.055)); }

    td {
      padding: 0;
      border-bottom: 1px solid #252b27;
    }

    td + td { border-left: 1px solid #252b27; }

    .cell-input {
      width: 100%;
      height: 43px;
      padding: 0 11px;
      border: 0;
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: #e8ece9;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    .cell-input[type="number"] { text-align: right; }
    .seconds-input { text-align: right; }
    .seconds-input.is-invalid,
    .seconds-input:invalid {
      color: #ffaaa5;
      background: rgba(255, 98, 89, 0.07);
      box-shadow: inset 0 0 0 2px rgba(255, 98, 89, 0.72);
    }
    .cell-input:hover { background: rgba(255, 255, 255, 0.025); }
    .cell-input:focus { background: #20261f; box-shadow: inset 0 0 0 2px var(--green-bright), 0 0 12px rgba(118, 185, 0, 0.08); }
    .seconds-input.is-invalid:focus,
    .seconds-input:invalid:focus {
      background: rgba(255, 98, 89, 0.09);
      box-shadow: inset 0 0 0 2px var(--danger), 0 0 12px rgba(255, 98, 89, 0.12);
    }
    .cell-input::placeholder { color: #59625c; }

    .row-delete-cell { text-align: center; }

    .delete-row {
      width: 35px;
      height: 43px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #68716b;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      transition: background 130ms ease, color 130ms ease;
    }

    tr:hover .delete-row { color: #aeb6b0; }
    .delete-row:hover { background: rgba(255, 98, 89, 0.14); color: var(--danger) !important; }
    .delete-row:focus-visible { outline: 2px solid var(--danger); outline-offset: -2px; color: var(--danger); }

    input[type="number"] { appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { margin: 0; appearance: none; }

    .panel-footer {
      min-height: 62px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-top: 1px solid #465048;
      background:
        linear-gradient(90deg, rgba(118, 185, 0, 0.045), transparent 55%),
        linear-gradient(180deg, #252c26, #202521);
    }

    .panel-footer-label {
      display: block;
      color: #c2c9c3;
      font-size: 12px;
      font-weight: 750;
    }

    .panel-footer-detail {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
    }

    .person-total {
      color: var(--text);
      font-size: 18px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      text-align: right;
      text-shadow: 0 0 18px rgba(255, 255, 255, 0.07);
    }

    .person-total span { color: var(--green-bright); font-size: 11px; font-weight: 800; }

    .target-slot {
      grid-column: 1 / -1;
      min-width: 0;
    }

    .target-status {
      width: 100%;
      display: block;
      padding: 9px 10px 8px;
      border: 1px solid #3d493f;
      border-radius: 4px;
      background: rgba(7, 10, 8, 0.42);
      color: inherit;
      text-align: left;
    }

    .target-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 8px;
      margin-bottom: 8px;
    }

    .target-field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .target-input-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.045em;
      text-transform: uppercase;
    }

    .target-input {
      width: 100%;
      height: 34px;
      padding: 0 9px;
      border: 1px solid #465048;
      border-radius: 3px;
      outline: 0;
      background: #121613;
      color: var(--text);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .target-input:focus {
      border-color: var(--green-bright);
      box-shadow: 0 0 0 2px rgba(118, 185, 0, 0.12);
    }

    .target-save {
      height: 34px;
      padding: 0 11px;
      border: 1px solid var(--green);
      border-radius: 3px;
      background: var(--green-soft);
      color: var(--green-bright);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .target-save:hover { background: rgba(118, 185, 0, 0.2); }
    .target-save:focus-visible {
      outline: 2px solid var(--green-bright);
      outline-offset: 2px;
    }

    .target-copy {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
    }

    .target-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.045em;
    }

    .target-remaining {
      color: var(--green-bright);
      font-size: 11px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .target-track {
      height: 4px;
      overflow: hidden;
      border-radius: 2px;
      background: #0a0d0b;
      box-shadow: inset 0 0 0 1px #303832;
    }

    .target-track span {
      display: block;
      width: var(--target-progress, 0%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green-deep), var(--green-bright));
      box-shadow: 0 0 10px rgba(118, 185, 0, 0.34);
    }

    .target-status.is-complete {
      border-color: rgba(118, 185, 0, 0.62);
      background: rgba(118, 185, 0, 0.075);
    }

    .target-status.is-complete .target-remaining { color: #d9ff91; }
    .target-status.is-complete .target-track span { background: var(--green-bright); }

    .target-status.is-over {
      border-color: rgba(255, 98, 89, 0.42);
      background: rgba(255, 98, 89, 0.035);
    }

    .target-status.is-over .target-remaining { color: #ff8d86; }
    .target-status.is-over .target-track span { background: linear-gradient(90deg, var(--green), #ff8d86); }

    .sidebar-stack {
      position: relative;
      width: 320px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-self: stretch;
      margin-left: 18px;
      overflow: visible;
    }

    .sidebar-stack::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -28px;
      width: 1px;
      background: var(--line-strong);
    }

    .notes-panel,
    .preset-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #3c463e;
      border-radius: 5px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.018), transparent 36%),
        #121512;
      box-shadow: inset 0 3px 0 #586159, 0 12px 32px rgba(0, 0, 0, 0.22);
    }

    .notes-panel {
      min-height: 300px;
      flex: 1;
    }

    .preset-panel {
      min-height: 248px;
      flex: 0 0 auto;
      box-shadow: inset 0 3px 0 var(--green), 0 12px 32px rgba(0, 0, 0, 0.22);
    }

    .notes-heading,
    .preset-heading {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      padding: 0 14px;
      border-bottom: 1px solid var(--line-strong);
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      background: linear-gradient(90deg, rgba(118, 185, 0, 0.055), transparent 62%);
    }

    .notes-heading-icon,
    .preset-heading-icon {
      color: var(--green);
      font-size: 18px;
      line-height: 1;
    }

    .notes-shortcuts {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      border-bottom: 1px solid #29312b;
      background: rgba(118, 185, 0, 0.035);
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
    }

    .folder-instruction {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 14px;
      border-bottom: 1px solid #29312b;
      background: rgba(118, 185, 0, 0.07);
      color: #cbd4cd;
      font-size: 11px;
      line-height: 1.4;
    }

    .folder-instruction-icon {
      color: var(--green-bright);
      font-size: 17px;
      line-height: 1;
    }

    .notes-shortcuts kbd {
      padding: 2px 5px;
      border: 1px solid #4b574e;
      border-bottom-color: #677568;
      border-radius: 3px;
      background: #202621;
      color: #dfe5e0;
      font: 700 9px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
      box-shadow: 0 1px 0 #080a08;
    }

    .shortcut-divider { color: #566158; }

    .notes-input {
      width: 100%;
      min-height: 250px;
      flex: 1;
      resize: none;
      padding: 15px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #e8ece9;
      font-size: 14px;
      line-height: 1.65;
      scrollbar-color: #465048 #151816;
    }

    .notes-input::placeholder { color: #5f6862; }
    .notes-input:focus { background: #171b18; box-shadow: inset 0 0 0 2px var(--green); }

    .preset-input {
      width: 100%;
      min-height: 148px;
      resize: vertical;
      padding: 15px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #e8ece9;
      font-size: 14px;
      line-height: 1.65;
    }

    .preset-input:focus { background: #171b18; box-shadow: inset 0 0 0 2px var(--green); }

    .preset-actions {
      min-height: 51px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-top: 1px solid var(--line-strong);
      background: #20251f;
    }

    .copy-button {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--green-bright);
      border-radius: 3px;
      background: linear-gradient(180deg, var(--green-bright), var(--green));
      color: #090b09;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(118, 185, 0, 0.14);
      transition: background 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }

    .copy-button:hover {
      background: linear-gradient(180deg, #abef24, var(--green-hover));
      border-color: #b6f33f;
      box-shadow: 0 8px 22px rgba(118, 185, 0, 0.24);
    }
    .copy-button:active { transform: translateY(1px); }
    .copy-button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .copy-status { color: var(--muted); font-size: 12px; }

    .empty-state {
      width: min(500px, calc(100vw - 68px));
      min-height: 460px;
      display: grid;
      place-items: center;
      padding: 40px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong { display: block; margin-bottom: 7px; color: var(--text); font-size: 16px; }

    .summary-bar {
      max-width: 1500px;
      min-height: 76px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 24px;
      margin: 18px auto 0;
      padding: 15px 20px;
      border: 1px solid #3d473f;
      border-left: 4px solid var(--green);
      border-radius: 4px;
      background:
        linear-gradient(90deg, rgba(118, 185, 0, 0.09), transparent 30%),
        linear-gradient(180deg, #171c18, #121512);
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.26), inset 0 1px rgba(255, 255, 255, 0.025);
    }

    .summary-label {
      display: block;
      margin-bottom: 3px;
      color: var(--green-bright);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .summary-time {
      display: block;
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.035em;
      text-shadow: 0 0 24px rgba(118, 185, 0, 0.08);
    }

    *::-webkit-scrollbar { width: 11px; height: 11px; }
    *::-webkit-scrollbar-track { background: #121512; }
    *::-webkit-scrollbar-thumb {
      border: 3px solid #121512;
      border-radius: 8px;
      background: #414b43;
    }
    *::-webkit-scrollbar-thumb:hover { background: var(--green); }

    .summary-meta {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .app-tabs {
      max-width: 1500px;
      display: flex;
      gap: 5px;
      margin: 0 auto 18px;
      padding: 4px;
      border: 1px solid #303831;
      border-radius: 5px;
      background: rgba(13, 16, 14, 0.86);
      width: fit-content;
    }

    .app-tab {
      min-height: 38px;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: color 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    .app-tab:hover { color: var(--text); background: rgba(255, 255, 255, 0.035); }
    .app-tab[aria-selected="true"] {
      border-color: rgba(155, 224, 0, 0.48);
      background: var(--green-soft);
      color: var(--green-bright);
      box-shadow: inset 0 -2px 0 var(--green);
    }
    .app-tab:focus-visible { outline: 2px solid var(--green-bright); outline-offset: 2px; }
    [role="tabpanel"][hidden] { display: none; }

    .countdown-layout {
      max-width: 1120px;
      display: grid;
      grid-template-columns: minmax(0, 760px) 320px;
      align-items: stretch;
      gap: 18px;
      margin: 0 auto;
    }

    .countdown-shell {
      min-width: 0;
      overflow: hidden;
      border: 1px solid #3c463e;
      border-radius: 6px;
      background:
        radial-gradient(circle at 50% 18%, rgba(118, 185, 0, 0.11), transparent 18rem),
        linear-gradient(180deg, #141815, #0d100e);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38), inset 0 3px 0 var(--green);
    }

    .countdown-log {
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #3c463e;
      border-radius: 6px;
      background: linear-gradient(180deg, #141815, #0d100e);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.3), inset 0 3px 0 #586159;
    }

    .countdown-log-heading {
      min-height: 68px;
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      padding: 0 16px;
      border-bottom: 1px solid var(--line-strong);
      font-size: 15px;
    }

    .countdown-log-heading span { color: var(--green); }
    .countdown-log-list { flex: 1; min-height: 260px; max-height: 480px; overflow-y: auto; padding: 8px; }
    .countdown-log-empty { padding: 28px 12px; color: var(--muted); font-size: 12px; line-height: 1.5; text-align: center; }

    .countdown-log-row {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto 36px;
      align-items: center;
      border-bottom: 1px solid #272d29;
    }

    .countdown-log-index {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .countdown-log-input {
      width: 100%;
      height: 42px;
      padding: 0 9px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .countdown-log-input:focus { background: #20261f; box-shadow: inset 0 0 0 2px var(--green-bright); }
    .countdown-log-input:invalid { color: #ffaaa5; box-shadow: inset 0 0 0 2px var(--danger); }
    .countdown-log-unit { padding-right: 7px; color: var(--muted); font-size: 10px; }

    .countdown-log-delete {
      width: 36px;
      height: 42px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #778079;
      font-size: 17px;
      cursor: pointer;
    }

    .countdown-log-delete:hover { background: rgba(255, 98, 89, 0.14); color: var(--danger); }
    .countdown-log-total {
      padding: 14px 16px;
      border-top: 1px solid var(--line-strong);
      background: #202521;
    }

    .countdown-log-export {
      width: 100%;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 13px;
      border: 1px solid var(--green-bright);
      border-radius: 3px;
      background: linear-gradient(180deg, var(--green-bright), var(--green));
      color: #090b09;
      font-size: 12px;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 7px 20px rgba(118, 185, 0, 0.16);
    }

    .countdown-log-export:hover { background: linear-gradient(180deg, #abef24, var(--green-hover)); }
    .countdown-log-export:disabled { opacity: 0.38; cursor: not-allowed; box-shadow: none; }
    .countdown-log-export:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    .countdown-log-clear {
      width: 100%;
      min-height: 34px;
      margin-bottom: 13px;
      border: 1px solid rgba(255, 98, 89, 0.48);
      border-radius: 3px;
      background: rgba(255, 98, 89, 0.06);
      color: #ffaaa5;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .countdown-log-clear:hover { border-color: var(--danger); background: rgba(255, 98, 89, 0.14); color: #ffd0cd; }
    .countdown-log-clear:disabled { opacity: 0.3; cursor: not-allowed; }
    .countdown-log-clear:focus-visible { outline: 2px solid var(--danger); outline-offset: 2px; }

    .countdown-log-total-label { display: block; color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .countdown-log-total-time { display: block; margin-top: 4px; color: var(--green-bright); font-size: 22px; font-weight: 850; font-variant-numeric: tabular-nums; }
    .countdown-log-total-time small { color: var(--muted); font-size: 9px; }

    .countdown-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 19px 22px;
      border-bottom: 1px solid var(--line-strong);
    }

    .countdown-header h2 { margin: 0; font-size: 17px; }
    .countdown-header p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }

    .voice-toggle {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #d8ded9;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      white-space: nowrap;
    }
    .voice-toggle input { width: 17px; height: 17px; accent-color: var(--green); }

    .countdown-options {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px 18px;
    }

    .hotkey-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #d8ded9;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      white-space: nowrap;
    }

    .hotkey-toggle input { width: 17px; height: 17px; accent-color: var(--green); }
    .hotkey-toggle kbd {
      min-width: 20px;
      padding: 2px 5px;
      border: 1px solid #536052;
      border-bottom-width: 2px;
      border-radius: 3px;
      background: #0c0f0d;
      color: var(--green-bright);
      font-size: 10px;
      text-align: center;
    }

    .countdown-body { padding: clamp(26px, 6vw, 52px); text-align: center; }

    .countdown-display {
      color: var(--text);
      font-size: clamp(72px, 16vw, 132px);
      font-weight: 860;
      font-variant-numeric: tabular-nums;
      line-height: 0.92;
      letter-spacing: -0.065em;
      text-shadow: 0 0 34px rgba(118, 185, 0, 0.12);
    }
    .countdown-display.is-urgent { color: #dfff9e; text-shadow: 0 0 30px rgba(155, 224, 0, 0.28); }
    .countdown-display.is-finished { color: var(--green-bright); }

    .countdown-status {
      min-height: 20px;
      margin: 15px 0 24px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .countdown-input-row {
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .countdown-field { display: grid; gap: 6px; text-align: left; }
    .countdown-field label { color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .countdown-input {
      width: 132px;
      height: 44px;
      padding: 0 12px;
      border: 1px solid #4b574d;
      border-radius: 3px;
      outline: 0;
      background: #0c0f0d;
      color: var(--text);
      font-size: 16px;
      font-weight: 750;
      text-align: center;
    }
    .countdown-input:focus { border-color: var(--green-bright); box-shadow: 0 0 0 3px var(--green-soft); }

    .countdown-presets { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin-bottom: 24px; }
    .preset-time-button {
      padding: 7px 11px;
      border: 1px solid #39423b;
      border-radius: 3px;
      background: #171b18;
      color: #bcc4be;
      font-size: 11px;
      font-weight: 750;
      cursor: pointer;
    }
    .preset-time-button:hover { border-color: var(--green); color: var(--green-bright); }

    .countdown-actions { display: flex; justify-content: center; gap: 10px; }
    .countdown-action {
      min-width: 116px;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid #465048;
      border-radius: 3px;
      background: #202521;
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }
    .countdown-action:hover { border-color: #667268; background: #272d28; }
    .countdown-action.start { border-color: var(--green-bright); background: var(--green); color: #090b09; }
    .countdown-action.start:hover { background: var(--green-hover); }
    .countdown-action:disabled { opacity: 0.42; cursor: not-allowed; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .celebration-layer {
      position: fixed;
      inset: 0;
      z-index: 40;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti-piece {
      position: fixed;
      width: var(--size, 8px);
      height: calc(var(--size, 8px) * 0.52);
      border-radius: 1px;
      background: var(--confetti-color, var(--green));
      box-shadow: 0 0 8px color-mix(in srgb, var(--confetti-color) 45%, transparent);
      opacity: 0;
      will-change: transform, opacity;
      animation: confetti-burst var(--duration, 1500ms) cubic-bezier(0.16, 0.72, 0.28, 1) var(--delay, 0ms) forwards;
    }

    @keyframes confetti-burst {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, 0) rotate(0deg) scale(0.5);
      }
      10% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate3d(var(--travel-x), var(--travel-y), 0) rotate(var(--spin)) scale(1);
      }
    }

    .celebration-toast {
      position: fixed;
      top: 24px;
      left: 50%;
      z-index: 41;
      min-width: min(360px, calc(100vw - 32px));
      padding: 13px 18px;
      border: 1px solid var(--green-bright);
      border-radius: 5px;
      background:
        linear-gradient(110deg, rgba(118, 185, 0, 0.18), transparent 55%),
        rgba(13, 17, 14, 0.96);
      color: var(--text);
      text-align: center;
      box-shadow: 0 18px 54px rgba(0, 0, 0, 0.46), 0 0 28px rgba(118, 185, 0, 0.18);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -18px) scale(0.96);
      transition: opacity 180ms ease, transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .celebration-toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    .celebration-toast strong {
      display: block;
      color: var(--green-bright);
      font-size: 17px;
      letter-spacing: -0.01em;
    }

    .celebration-toast span {
      display: block;
      margin-top: 3px;
      color: #d6ddd7;
      font-size: 12px;
    }

    @media (max-width: 650px) {
      :root { --panel-width: 365px; }
      .app { padding: 26px 12px 32px; }
      .topbar { align-items: flex-start; }
      .kicker { display: none; }
      .primary-button { width: 40px; padding: 0; }
      .primary-button .button-label { display: none; }
      .people-grid { gap: 12px; padding: 12px; }
      .sidebar-stack { width: 300px; min-width: 300px; margin-left: 12px; }
      .summary-bar { grid-template-columns: 1fr; gap: 8px; }
      .summary-meta { text-align: left; }
      .app-tabs { width: 100%; }
      .app-tab { flex: 1; padding-inline: 10px; }
      .countdown-header { align-items: flex-start; padding: 16px; }
      .countdown-header { flex-direction: column; }
      .countdown-options { justify-content: flex-start; }
      .countdown-body { padding-inline: 16px; }
      .countdown-actions { flex-wrap: wrap; }
      .countdown-action { flex: 1; min-width: 92px; }
      .countdown-layout { grid-template-columns: minmax(0, 1fr); }
      .countdown-log-list { min-height: 180px; max-height: 340px; }
    }

    @media (max-width: 400px) {
      :root { --panel-width: 338px; }
      .brand-mark { display: none; }
      th { padding-inline: 8px; font-size: 11px; }
      .cell-input { padding-inline: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      .cursor-light { display: none; }
      .gpu-cube { animation: none; }
      .confetti-piece { display: none; }
    }

    @media (pointer: coarse) {
      .cursor-light { display: none; }
    }

    @media (max-width: 900px) {
      .visual-effects { display: none; }
    }
  </style>
</head>
<body>
  <div class="cursor-light" id="cursorLight" aria-hidden="true"></div>
  <div class="sr-only" id="historyStatus" role="status" aria-live="polite"></div>
  <div class="celebration-layer" id="celebrationLayer" aria-hidden="true"></div>
  <div class="celebration-toast" id="celebrationToast" role="status" aria-live="assertive">
    <strong>Nice job!</strong>
    <span id="celebrationMessage">Quota for the day met.</span>
  </div>
  <input id="folderInput" type="file" accept="video/*" webkitdirectory directory multiple hidden>
  <div class="import-status" id="importStatus" role="status" aria-live="polite"></div>
  <div class="visual-effects" aria-hidden="true">
    <div class="gpu-cube gpu-cube-one">
      <span class="cube-front"></span>
      <span class="cube-right"></span>
      <span class="cube-top"></span>
    </div>
    <div class="gpu-cube gpu-cube-two">
      <span class="cube-front"></span>
      <span class="cube-right"></span>
      <span class="cube-top"></span>
    </div>
  </div>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="favicon.svg" alt="" width="38" height="38" aria-hidden="true">
        <div>
          <h1>Calculator EgoDex V3</h1>
          <p class="kicker">Production timing worksheet</p>
        </div>
      </div>
      <button class="primary-button" id="addPerson" type="button">
        <span class="icon" aria-hidden="true">+</span>
        <span class="button-label">Add person</span>
      </button>
    </header>

    <nav class="app-tabs" role="tablist" aria-label="Tools">
      <button class="app-tab" id="worksheetTab" type="button" role="tab" aria-selected="true" aria-controls="worksheetPanel">Time sheet</button>
      <button class="app-tab" id="countdownTab" type="button" role="tab" aria-selected="false" aria-controls="countdownPanel" tabindex="-1">Countdown</button>
    </nav>

    <div id="worksheetPanel" role="tabpanel" aria-labelledby="worksheetTab">

      <section class="worksheet-shell" id="worksheet" aria-label="Video timing worksheet">
        <div class="people-grid" id="peopleGrid"></div>
      </section>

      <aside class="summary-bar" aria-live="polite">
        <div>
          <span class="summary-label">Combined total</span>
          <span class="summary-time" id="combinedTime">0 min 0 sec</span>
        </div>
        <div class="summary-meta" id="combinedMeta">0 seconds across 0 video rows</div>
      </aside>
    </div>

    <section id="countdownPanel" role="tabpanel" aria-labelledby="countdownTab" hidden>
      <div class="countdown-layout">
        <div class="countdown-shell">
        <header class="countdown-header">
          <div>
            <h2>Voice countdown</h2>
            <p>Set up to 1,200 seconds (20 minutes).</p>
          </div>
          <div class="countdown-options">
            <label class="hotkey-toggle" title="Press C to start; press C again to stop"><input id="countdownHotkeyEnabled" type="checkbox" checked> Enable <kbd>C</kbd> toggle</label>
            <label class="voice-toggle"><input id="voiceEnabled" type="checkbox" checked> Voice on</label>
          </div>
        </header>
        <div class="countdown-body">
          <div class="countdown-display" id="countdownDisplay" role="timer" aria-live="off" aria-label="1 minute remaining">01:00</div>
          <div class="countdown-status" id="countdownStatus" role="status" aria-live="polite">Ready</div>
          <div class="countdown-input-row">
            <div class="countdown-field">
              <label for="countdownSeconds">Seconds</label>
              <input class="countdown-input" id="countdownSeconds" type="number" min="1" max="1200" step="1" value="60" inputmode="numeric">
            </div>
          </div>
          <div class="countdown-presets" aria-label="Countdown presets">
            <button class="preset-time-button" type="button" data-countdown-seconds="30">30 sec</button>
            <button class="preset-time-button" type="button" data-countdown-seconds="60">1 min</button>
            <button class="preset-time-button" type="button" data-countdown-seconds="300">5 min</button>
            <button class="preset-time-button" type="button" data-countdown-seconds="600">10 min</button>
            <button class="preset-time-button" type="button" data-countdown-seconds="1200">20 min</button>
          </div>
          <div class="countdown-actions">
            <button class="countdown-action start" id="countdownStart" type="button">Start</button>
            <button class="countdown-action" id="countdownPause" type="button" disabled>Pause</button>
            <button class="countdown-action" id="countdownReset" type="button">Reset</button>
          </div>
        </div>
        </div>
        <aside class="countdown-log" aria-labelledby="countdownLogHeading">
          <h2 class="countdown-log-heading" id="countdownLogHeading"><span aria-hidden="true">#</span> Countdown log</h2>
          <div class="countdown-log-list" id="countdownLogList"></div>
          <footer class="countdown-log-total">
            <button class="countdown-log-export" id="countdownLogExport" type="button"><span aria-hidden="true">&#8594;</span> Add to time sheet</button>
            <button class="countdown-log-clear" id="countdownLogClear" type="button">Clear everything</button>
            <span class="countdown-log-total-label">Total completed</span>
            <span class="countdown-log-total-time" id="countdownLogTotal">00:00 <small>MIN:SEC</small></span>
          </footer>
        </aside>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "video-time-sheet-dark-v1";
      const NOTES_STORAGE_KEY = "video-time-sheet-notes-v1";
      const PRESET_STORAGE_KEY = "video-time-sheet-preset-v1";
      const TARGET_STORAGE_KEY = "video-time-sheet-daily-target-v1";
      const COUNTDOWN_LOG_STORAGE_KEY = "video-time-sheet-countdown-log-v1";
      const DEFAULT_PRESET = "Operator Name:\nTask:\nMinutes:\nGear:";
      const grid = document.querySelector("#peopleGrid");
      const worksheet = document.querySelector("#worksheet");
      const addPersonButton = document.querySelector("#addPerson");
      const combinedTime = document.querySelector("#combinedTime");
      const combinedMeta = document.querySelector("#combinedMeta");
      const cursorLight = document.querySelector("#cursorLight");
      const historyStatus = document.querySelector("#historyStatus");
      const celebrationLayer = document.querySelector("#celebrationLayer");
      const celebrationToast = document.querySelector("#celebrationToast");
      const celebrationMessage = document.querySelector("#celebrationMessage");
      const folderInput = document.querySelector("#folderInput");
      const importStatus = document.querySelector("#importStatus");
      const worksheetTab = document.querySelector("#worksheetTab");
      const countdownTab = document.querySelector("#countdownTab");
      const worksheetPanel = document.querySelector("#worksheetPanel");
      const countdownPanel = document.querySelector("#countdownPanel");
      const countdownDisplay = document.querySelector("#countdownDisplay");
      const countdownStatus = document.querySelector("#countdownStatus");
      const countdownSecondsInput = document.querySelector("#countdownSeconds");
      const countdownStart = document.querySelector("#countdownStart");
      const countdownPause = document.querySelector("#countdownPause");
      const countdownReset = document.querySelector("#countdownReset");
      const voiceEnabled = document.querySelector("#voiceEnabled");
      const countdownHotkeyEnabled = document.querySelector("#countdownHotkeyEnabled");
      const countdownLogList = document.querySelector("#countdownLogList");
      const countdownLogTotal = document.querySelector("#countdownLogTotal");
      const countdownLogExport = document.querySelector("#countdownLogExport");
      const countdownLogClear = document.querySelector("#countdownLogClear");

      let people = load();
      let notes = localStorage.getItem(NOTES_STORAGE_KEY) || "";
      const savedPreset = localStorage.getItem(PRESET_STORAGE_KEY);
      let preset = savedPreset?.trim() ? savedPreset : DEFAULT_PRESET;
      let targetSeconds = loadTarget();
      let countdownLog = loadCountdownLog();
      const undoStack = [];
      const redoStack = [];
      const HISTORY_LIMIT = 100;
      let editStartSnapshot = null;
      let audioContext = null;
      let celebrationTimer = 0;
      let importStatusTimer = 0;
      let importPersonId = null;
      let countdownInterval = 0;
      let countdownEndTime = 0;
      let countdownRemaining = 60;
      let countdownRunning = false;
      let countdownStarted = false;
      let lastAnnouncedSecond = null;
      let countdownSessionTotal = 60;
      let countdownElapsedBeforeRun = 0;
      let countdownRunStartedAt = 0;
      const importingPeople = new Set();
      const knownPersonTotals = new Map();

      if (window.matchMedia("(pointer: fine)").matches && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        let pointerX = 0;
        let pointerY = 0;
        let pointerFrame = 0;

        document.addEventListener("pointermove", (event) => {
          pointerX = event.clientX;
          pointerY = event.clientY;
          cursorLight.style.opacity = "1";

          if (pointerFrame) return;
          pointerFrame = requestAnimationFrame(() => {
            cursorLight.style.transform = `translate3d(${pointerX - 230}px, ${pointerY - 230}px, 0)`;
            pointerFrame = 0;
          });
        }, { passive: true });

        document.documentElement.addEventListener("mouseleave", () => {
          cursorLight.style.opacity = "0";
        });
      }

      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function loadCountdownLog() {
        try {
          const saved = JSON.parse(localStorage.getItem(COUNTDOWN_LOG_STORAGE_KEY));
          if (!Array.isArray(saved)) return [];
          return saved
            .filter((entry) => Number.isFinite(Number(entry?.seconds)) && Number(entry.seconds) >= 0)
            .map((entry) => ({ id: String(entry.id || uid()), seconds: Math.round(Number(entry.seconds)) }));
        } catch (_) {
          return [];
        }
      }

      function saveCountdownLog() {
        localStorage.setItem(COUNTDOWN_LOG_STORAGE_KEY, JSON.stringify(countdownLog));
      }

      function renderCountdownLog() {
        if (!countdownLog.length) {
          countdownLogList.innerHTML = '<div class="countdown-log-empty">Finished countdowns will appear here automatically.</div>';
        } else {
          countdownLogList.innerHTML = countdownLog.map((entry, index) => `
            <div class="countdown-log-row" data-log-id="${escapeHtml(entry.id)}">
              <span class="countdown-log-index">${index}</span>
              <input class="countdown-log-input" type="text" inputmode="text" value="${clockTime(entry.seconds)}" aria-label="Countdown ${index} duration">
              <span class="countdown-log-unit">mins</span>
              <button class="countdown-log-delete" type="button" aria-label="Delete countdown ${index}" title="Delete countdown">&times;</button>
            </div>`).join("");
        }

        const total = countdownLog.reduce((sum, entry) => sum + entry.seconds, 0);
        countdownLogTotal.innerHTML = `${clockTime(total)} <small>MIN:SEC</small>`;
        countdownLogExport.disabled = countdownLog.length === 0;
        countdownLogClear.disabled = countdownLog.length === 0;
      }

      function addCountdownLog(seconds) {
        const completedSeconds = Math.max(0, Math.round(seconds));
        if (!completedSeconds) return;
        countdownLog.push({ id: uid(), seconds: completedSeconds });
        saveCountdownLog();
        renderCountdownLog();
        countdownLogList.scrollTop = countdownLogList.scrollHeight;
      }

      function exportCountdownLogToTimeSheet() {
        if (!countdownLog.length) return;

        const usedNames = new Set(people.map((person) => person.name.trim().toLowerCase()));
        let exportName = "Countdown Log";
        let suffix = 2;
        while (usedNames.has(exportName.toLowerCase())) exportName = `Countdown Log ${suffix++}`;

        recordCurrentState();
        const person = newPerson(people.length + 1);
        person.name = exportName;
        person.rows = countdownLog.map((entry, index) => ({
          id: uid(),
          videoNumber: index + 1,
          seconds: clockTime(entry.seconds),
          fileNumber: `Countdown ${index}`
        }));
        people.push(person);
        save();
        render();
        selectTab(worksheetTab);
        requestAnimationFrame(() => {
          worksheet.scrollTo({ left: worksheet.scrollWidth, behavior: "smooth" });
          grid.querySelector(`[data-person-id="${person.id}"] .name-input`)?.focus();
        });
      }

      function clearCountdownLog() {
        if (!countdownLog.length) return;
        const confirmed = window.confirm(`Clear all ${countdownLog.length} countdown log ${countdownLog.length === 1 ? "entry" : "entries"}? This cannot be undone.`);
        if (!confirmed) return;
        countdownLog = [];
        saveCountdownLog();
        renderCountdownLog();
      }

      function newRow(videoNumber = 1) {
        return { id: uid(), videoNumber, seconds: "", fileNumber: "" };
      }

      function newPerson(number) {
        return { id: uid(), name: `Person ${number}`, rows: [newRow(1)] };
      }

      function load() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (Array.isArray(saved)) return saved;
        } catch (_) {}
        return [newPerson(1)];
      }

      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(people));
      }

      function stateSnapshot() {
        return JSON.stringify({ people, notes, preset });
      }

      function pushUndoSnapshot(snapshot) {
        if (!snapshot || undoStack.at(-1) === snapshot) return;
        undoStack.push(snapshot);
        if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
        redoStack.length = 0;
      }

      function recordCurrentState() {
        pushUndoSnapshot(stateSnapshot());
      }

      function persistState() {
        save();
        localStorage.setItem(NOTES_STORAGE_KEY, notes);
        if (preset.trim()) {
          localStorage.setItem(PRESET_STORAGE_KEY, preset);
        } else {
          localStorage.removeItem(PRESET_STORAGE_KEY);
        }
      }

      function restoreSnapshot(snapshot) {
        const state = JSON.parse(snapshot);
        people = state.people;
        notes = state.notes ?? "";
        preset = state.preset ?? DEFAULT_PRESET;
        persistState();
        render();
      }

      function announceHistory(message) {
        historyStatus.textContent = "";
        requestAnimationFrame(() => {
          historyStatus.textContent = message;
        });
      }

      function undo() {
        const snapshot = undoStack.pop();
        if (!snapshot) return false;
        redoStack.push(stateSnapshot());
        restoreSnapshot(snapshot);
        announceHistory("Change undone");
        return true;
      }

      function redo() {
        const snapshot = redoStack.pop();
        if (!snapshot) return false;
        undoStack.push(stateSnapshot());
        restoreSnapshot(snapshot);
        announceHistory("Change redone");
        return true;
      }

      function getAudioContext() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        if (!audioContext) audioContext = new AudioContextClass();
        if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
        return audioContext;
      }

      function playTone(startFrequency, endFrequency, duration, delay = 0, volume = 0.025, type = "sine") {
        try {
          const context = getAudioContext();
          if (!context) return;

          const start = context.currentTime + delay;
          const oscillator = context.createOscillator();
          const gain = context.createGain();
          oscillator.type = type;
          oscillator.frequency.setValueAtTime(startFrequency, start);
          oscillator.frequency.exponentialRampToValueAtTime(endFrequency, start + duration);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(volume, start + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
          oscillator.connect(gain);
          gain.connect(context.destination);
          oscillator.start(start);
          oscillator.stop(start + duration + 0.02);
        } catch (_) {}
      }

      function playButtonSound(action) {
        if (action === "add-row" || action === "addPerson") {
          playTone(430, 540, 0.075, 0, 0.022, "triangle");
          playTone(610, 760, 0.09, 0.055, 0.018, "triangle");
          return;
        }

        if (action === "delete-row" || action === "delete-person") {
          playTone(250, 145, 0.11, 0, 0.018, "triangle");
          return;
        }

        if (action === "copy-preset") {
          playTone(620, 780, 0.075, 0, 0.02, "sine");
          playTone(820, 980, 0.09, 0.065, 0.016, "sine");
          return;
        }

        playTone(360, 440, 0.065, 0, 0.018, "sine");
      }

      function playCompletionSound() {
        [
          [523.25, 0],
          [659.25, 0.09],
          [783.99, 0.18],
          [1046.5, 0.29]
        ].forEach(([frequency, delay], index) => {
          playTone(frequency, frequency * 1.015, index === 3 ? 0.32 : 0.2, delay, 0.035, "triangle");
        });
      }

      function countdownTime(seconds) {
        const whole = Math.max(0, Math.min(1200, Math.ceil(seconds)));
        return `${String(Math.floor(whole / 60)).padStart(2, "0")}:${String(whole % 60).padStart(2, "0")}`;
      }

      function elapsedDurationText(seconds) {
        const totalSeconds = Math.max(0, Math.round(seconds));
        const minutes = Math.floor(totalSeconds / 60);
        const remainder = totalSeconds % 60;
        const parts = [];
        if (minutes) parts.push(`${minutes} ${minutes === 1 ? "minute" : "minutes"}`);
        if (remainder || !minutes) parts.push(`${remainder} ${remainder === 1 ? "second" : "seconds"}`);
        return parts.join(" and ");
      }

      function countdownAriaLabel(seconds) {
        const whole = Math.max(0, Math.ceil(seconds));
        if (!whole) return "Time is up";
        const minutes = Math.floor(whole / 60);
        const remainder = whole % 60;
        return [
          minutes ? `${minutes} ${minutes === 1 ? "minute" : "minutes"}` : "",
          remainder ? `${remainder} ${remainder === 1 ? "second" : "seconds"}` : ""
        ].filter(Boolean).join(" and ") + " remaining";
      }

      function speakCountdown(message) {
        if (!voiceEnabled.checked || !("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(String(message));
        utterance.rate = typeof message === "number" ? 1.7 : 1.15;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
      }

      function updateCountdownDisplay() {
        countdownDisplay.textContent = countdownTime(countdownRemaining);
        countdownDisplay.setAttribute("aria-label", countdownAriaLabel(countdownRemaining));
        countdownDisplay.classList.toggle("is-urgent", countdownRemaining > 0 && countdownRemaining <= 10);
        countdownDisplay.classList.toggle("is-finished", countdownStarted && countdownRemaining === 0);
      }

      function setCountdownInputsDisabled(disabled) {
        countdownSecondsInput.disabled = disabled;
        document.querySelectorAll("[data-countdown-seconds]").forEach((button) => { button.disabled = disabled; });
      }

      function finishCountdown() {
        window.clearInterval(countdownInterval);
        countdownInterval = 0;
        countdownRunning = false;
        countdownRemaining = 0;
        lastAnnouncedSecond = 0;
        updateCountdownDisplay();
        countdownStatus.textContent = "Time is up";
        countdownStart.textContent = "Start again";
        countdownStart.disabled = false;
        countdownPause.disabled = true;
        setCountdownInputsDisabled(false);
        addCountdownLog(countdownSessionTotal);
        const completed = elapsedDurationText(countdownSessionTotal);
        countdownStatus.textContent = `Time is up • ${completed} completed`;
        speakCountdown(`Time is up. You completed ${completed}.`);
        playCompletionSound();
      }

      function stopCountdownAndReport() {
        if (!countdownRunning) return false;
        countdownTick();
        if (!countdownRunning) return true;

        countdownElapsedBeforeRun += Math.max(0, (performance.now() - countdownRunStartedAt) / 1000);
        countdownRunning = false;
        countdownStarted = false;
        window.clearInterval(countdownInterval);
        countdownInterval = 0;
        window.speechSynthesis?.cancel();
        const elapsedSeconds = Math.min(countdownSessionTotal, countdownElapsedBeforeRun);
        addCountdownLog(elapsedSeconds);
        const completed = elapsedDurationText(elapsedSeconds);
        countdownStatus.textContent = `Stopped • ${completed} completed`;
        countdownStart.disabled = false;
        countdownStart.textContent = "Start again";
        countdownPause.disabled = true;
        setCountdownInputsDisabled(false);
        speakCountdown(`Stopped. You completed ${completed}.`);
        return true;
      }

      function countdownTick() {
        if (!countdownRunning) return;
        const nextRemaining = Math.max(0, Math.ceil((countdownEndTime - performance.now()) / 1000));
        if (nextRemaining !== countdownRemaining) {
          countdownRemaining = nextRemaining;
          updateCountdownDisplay();
          if (countdownRemaining > 0 && countdownRemaining !== lastAnnouncedSecond) {
            lastAnnouncedSecond = countdownRemaining;
            speakCountdown(countdownRemaining);
          }
        }
        if (countdownRemaining <= 0) finishCountdown();
      }

      function startCountdown() {
        if (countdownRunning) return false;
        if (!countdownStarted || countdownRemaining <= 0) {
          const requested = Math.round(Number(countdownSecondsInput.value));
          if (!Number.isFinite(requested) || requested < 1 || requested > 1200) {
            countdownSecondsInput.setCustomValidity("Enter a whole number from 1 to 1,200 seconds.");
            countdownSecondsInput.reportValidity();
            return false;
          }
          countdownRemaining = requested;
          countdownSessionTotal = requested;
          countdownElapsedBeforeRun = 0;
          countdownStarted = true;
        }
        countdownSecondsInput.setCustomValidity("");
        countdownRunning = true;
        countdownRunStartedAt = performance.now();
        countdownEndTime = performance.now() + countdownRemaining * 1000;
        lastAnnouncedSecond = countdownRemaining;
        countdownStatus.textContent = "Counting down";
        countdownStart.disabled = true;
        countdownStart.textContent = "Start";
        countdownPause.disabled = false;
        countdownPause.textContent = "Pause";
        setCountdownInputsDisabled(true);
        updateCountdownDisplay();
        speakCountdown(countdownRemaining);
        window.clearInterval(countdownInterval);
        countdownInterval = window.setInterval(countdownTick, 100);
        return true;
      }

      function pauseCountdown() {
        if (!countdownRunning) return;
        countdownTick();
        if (!countdownRunning) return;
        countdownElapsedBeforeRun += Math.max(0, (performance.now() - countdownRunStartedAt) / 1000);
        countdownRunning = false;
        window.clearInterval(countdownInterval);
        countdownInterval = 0;
        window.speechSynthesis?.cancel();
        countdownStatus.textContent = "Paused";
        countdownStart.disabled = false;
        countdownStart.textContent = "Resume";
        countdownPause.disabled = true;
      }

      function resetCountdown() {
        countdownRunning = false;
        countdownStarted = false;
        countdownElapsedBeforeRun = 0;
        window.clearInterval(countdownInterval);
        countdownInterval = 0;
        window.speechSynthesis?.cancel();
        const requested = Math.round(Number(countdownSecondsInput.value));
        countdownRemaining = Number.isFinite(requested) ? Math.max(1, Math.min(1200, requested)) : 60;
        countdownSessionTotal = countdownRemaining;
        countdownSecondsInput.value = countdownRemaining;
        countdownSecondsInput.setCustomValidity("");
        countdownStatus.textContent = "Ready";
        countdownStart.disabled = false;
        countdownStart.textContent = "Start";
        countdownPause.disabled = true;
        countdownPause.textContent = "Pause";
        setCountdownInputsDisabled(false);
        updateCountdownDisplay();
      }

      function selectTab(tab) {
        const showCountdown = tab === countdownTab;
        worksheetTab.setAttribute("aria-selected", String(!showCountdown));
        countdownTab.setAttribute("aria-selected", String(showCountdown));
        worksheetTab.tabIndex = showCountdown ? -1 : 0;
        countdownTab.tabIndex = showCountdown ? 0 : -1;
        worksheetPanel.hidden = showCountdown;
        countdownPanel.hidden = !showCountdown;
        addPersonButton.hidden = showCountdown;
      }

      function launchConfetti(panel) {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        const source = panel?.querySelector(".target-status")?.getBoundingClientRect();
        const originX = source ? source.left + (source.width / 2) : window.innerWidth / 2;
        const originY = source ? source.top + 8 : window.innerHeight * 0.28;
        const colors = ["#76b900", "#9be000", "#d9ff91", "#f4f6f4", "#4f7c00"];
        const fragment = document.createDocumentFragment();
        celebrationLayer.replaceChildren();

        for (let index = 0; index < 64; index += 1) {
          const piece = document.createElement("i");
          const angle = (Math.random() * Math.PI) + Math.PI;
          const distance = 130 + (Math.random() * 310);
          const travelX = Math.cos(angle) * distance;
          const travelY = 190 + (Math.random() * Math.max(220, window.innerHeight * 0.48));
          piece.className = "confetti-piece";
          piece.style.left = `${originX}px`;
          piece.style.top = `${originY}px`;
          piece.style.setProperty("--travel-x", `${travelX}px`);
          piece.style.setProperty("--travel-y", `${travelY}px`);
          piece.style.setProperty("--spin", `${Math.round((Math.random() - 0.5) * 1100)}deg`);
          piece.style.setProperty("--delay", `${Math.round(Math.random() * 170)}ms`);
          piece.style.setProperty("--duration", `${1250 + Math.round(Math.random() * 650)}ms`);
          piece.style.setProperty("--size", `${5 + Math.round(Math.random() * 7)}px`);
          piece.style.setProperty("--confetti-color", colors[index % colors.length]);
          fragment.appendChild(piece);
        }

        celebrationLayer.appendChild(fragment);
        window.setTimeout(() => celebrationLayer.replaceChildren(), 2200);
      }

      function celebrateTarget(person, panel) {
        const personName = person.name.trim() || "This person";
        celebrationMessage.textContent = `Quota for the day met — ${personName}.`;
        celebrationToast.classList.add("is-visible");
        window.clearTimeout(celebrationTimer);
        celebrationTimer = window.setTimeout(() => {
          celebrationToast.classList.remove("is-visible");
        }, 3600);
        launchConfetti(panel);
        playCompletionSound();
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function durationError(value) {
        const input = String(value ?? "").trim();
        if (!input) return "";

        if (!input.includes(":")) {
          const seconds = Number(input);
          return Number.isFinite(seconds) && seconds >= 0
            ? ""
            : "Enter a non-negative number of seconds, M:SS, or H:MM:SS.";
        }

        const parts = input.split(":").map((part) => part.trim());
        if (parts.length < 2 || parts.length > 3 || parts.some((part) => part === "" || !Number.isFinite(Number(part)) || Number(part) < 0)) {
          return "Use M:SS or H:MM:SS with non-negative numbers.";
        }

        const numbers = parts.map(Number);
        if (parts.length === 2) {
          const [minutes, seconds] = numbers;
          if (!Number.isInteger(minutes) || seconds >= 60) {
            return "Use M:SS; minutes must be whole and seconds must be below 60.";
          }
          return "";
        }

        const [hours, minutes, seconds] = numbers;
        if (!Number.isInteger(hours) || !Number.isInteger(minutes) || minutes >= 60 || seconds >= 60) {
          return "Use H:MM:SS; hours and minutes must be whole, and minutes and seconds must be below 60.";
        }
        return "";
      }

      function parseDuration(value) {
        const input = String(value ?? "").trim();
        if (!input || durationError(input)) return 0;
        if (!input.includes(":")) return Number(input);

        const parts = input.split(":").map(Number);
        if (parts.length === 2) return (parts[0] * 60) + parts[1];
        return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
      }

      function applyDurationValidity(input) {
        const message = durationError(input.value);
        input.setCustomValidity(message);
        input.classList.toggle("is-invalid", Boolean(message));
        input.setAttribute("aria-invalid", String(Boolean(message)));
        if (message) {
          input.title = message;
        } else {
          input.removeAttribute("title");
        }
        return !message;
      }

      function totalSeconds(person) {
        return person.rows.reduce((sum, row) => sum + parseDuration(row.seconds), 0);
      }

      function friendlyTime(seconds) {
        const whole = Math.max(0, Math.floor(seconds));
        return `${Math.floor(whole / 60)} min ${whole % 60} sec`;
      }

      function clockTime(seconds) {
        const whole = Math.max(0, Math.floor(seconds));
        const minutes = Math.floor(whole / 60);
        const remainingSeconds = String(whole % 60).padStart(2, "0");
        return `${minutes}:${remainingSeconds}`;
      }

      function todayKey() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function loadTarget() {
        try {
          const saved = JSON.parse(localStorage.getItem(TARGET_STORAGE_KEY));
          if (saved?.date === todayKey() && Number.isFinite(saved.seconds) && saved.seconds > 0) {
            return saved.seconds;
          }
        } catch (_) {}
        return null;
      }

      function setTarget(form) {
        const input = form.querySelector(".target-input");
        const minutes = Number(input?.value);
        if (!input || !Number.isFinite(minutes) || minutes <= 0) {
          input?.setCustomValidity("Enter a number of minutes greater than 0.");
          input?.reportValidity();
          return;
        }

        input.setCustomValidity("");
        targetSeconds = Math.max(1, Math.round(minutes * 60));
        localStorage.setItem(TARGET_STORAGE_KEY, JSON.stringify({
          date: todayKey(),
          seconds: targetSeconds
        }));
        render();
      }

      function targetMarkup(seconds) {
        const currentMinutes = targetSeconds ? Number((targetSeconds / 60).toFixed(2)) : "";
        const editor = `
          <form class="target-form">
            <label class="target-field">
              <span class="target-input-label">Daily target (minutes)</span>
              <input class="target-input" type="number" min="0.01" step="0.01" inputmode="decimal"
                value="${currentMinutes}" placeholder="e.g. 60" required aria-label="Daily target in minutes">
            </label>
            <button class="target-save" type="submit">${targetSeconds ? "Update" : "Set target"}</button>
          </form>`;

        if (!targetSeconds) return editor;

        const difference = targetSeconds - seconds;
        const progress = Math.min(100, Math.max(0, (seconds / targetSeconds) * 100));
        const stateClass = difference < 0 ? "is-over" : difference === 0 ? "is-complete" : "";
        const result = difference < 0
          ? `${friendlyTime(Math.abs(difference))} over target`
          : difference === 0
            ? "Target reached"
            : `${friendlyTime(difference)} remaining`;

        return `${editor}
          <div class="target-status ${stateClass}" style="--target-progress: ${progress}%">
            <span class="target-copy">
              <span class="target-label">Daily target &middot; ${friendlyTime(targetSeconds)}</span>
              <strong class="target-remaining">${result}</strong>
            </span>
            <span class="target-track" aria-hidden="true"><span></span></span>
          </div>`;
      }

      const VIDEO_EXTENSIONS = new Set([
        "3g2", "3gp", "avi", "flv", "m2ts", "m4v", "mkv", "mov", "mp4",
        "mpeg", "mpg", "mts", "ogv", "ts", "webm", "wmv"
      ]);

      function isVideoFile(file) {
        const extension = file.name.split(".").pop()?.toLowerCase();
        return file.type.startsWith("video/") || VIDEO_EXTENSIONS.has(extension);
      }

      function importedFileName(file) {
        const parts = (file.webkitRelativePath || file.name).split("/");
        return parts.length > 1 ? parts.slice(1).join("/") : file.name;
      }

      function editableDuration(seconds) {
        const whole = Math.max(0, Math.round(seconds));
        const hours = Math.floor(whole / 3600);
        const minutes = Math.floor((whole % 3600) / 60);
        const remainder = String(whole % 60).padStart(2, "0");
        return hours
          ? `${hours}:${String(minutes).padStart(2, "0")}:${remainder}`
          : `${minutes}:${remainder}`;
      }

      function readVideoDuration(file) {
        return new Promise((resolve, reject) => {
          const video = document.createElement("video");
          const objectUrl = URL.createObjectURL(file);
          const cleanup = () => {
            window.clearTimeout(timeout);
            video.onloadedmetadata = null;
            video.onerror = null;
            video.removeAttribute("src");
            video.load();
            URL.revokeObjectURL(objectUrl);
          };
          const fail = () => {
            cleanup();
            reject(new Error(`Could not read ${file.name}`));
          };
          const timeout = window.setTimeout(fail, 15000);
          video.preload = "metadata";
          video.onloadedmetadata = () => {
            const duration = video.duration;
            cleanup();
            Number.isFinite(duration) && duration >= 0 ? resolve(duration) : reject(new Error(`Invalid duration for ${file.name}`));
          };
          video.onerror = fail;
          video.src = objectUrl;
        });
      }

      async function mapWithConcurrency(items, limit, mapper) {
        const results = new Array(items.length);
        let nextIndex = 0;
        async function worker() {
          while (nextIndex < items.length) {
            const index = nextIndex++;
            try {
              results[index] = { status: "fulfilled", value: await mapper(items[index]) };
            } catch (reason) {
              results[index] = { status: "rejected", reason };
            }
          }
        }
        await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
        return results;
      }

      function showImportStatus(message, isError = false, persist = false) {
        window.clearTimeout(importStatusTimer);
        importStatus.textContent = message;
        importStatus.classList.toggle("is-error", isError);
        importStatus.classList.add("is-visible");
        if (!persist) {
          importStatusTimer = window.setTimeout(() => importStatus.classList.remove("is-visible"), 5000);
        }
      }

      async function importFolder(personId, files) {
        const person = people.find((item) => item.id === personId);
        if (!person) return;

        const videos = files.filter(isVideoFile).sort((a, b) =>
          importedFileName(a).localeCompare(importedFileName(b), undefined, { numeric: true, sensitivity: "base" })
        );
        if (!videos.length) {
          showImportStatus("No video files were found in that folder.", true);
          return;
        }

        importingPeople.add(personId);
        render();
        showImportStatus(`Reading duration 0 of ${videos.length}...`, false, true);
        let completed = 0;
        const results = await mapWithConcurrency(videos, 4, async (file) => {
          try {
            const duration = await readVideoDuration(file);
            return { file, duration };
          } finally {
            completed += 1;
            showImportStatus(`Reading duration ${completed} of ${videos.length}...`, false, true);
          }
        });

        const currentPerson = people.find((item) => item.id === personId);
        importingPeople.delete(personId);
        if (!currentPerson) {
          render();
          showImportStatus("The person was removed before the folder finished importing.", true);
          return;
        }

        const imported = results
          .filter((result) => result.status === "fulfilled")
          .map((result) => result.value);
        const failed = results.length - imported.length;
        if (imported.length) {
          recordCurrentState();
          const hasOnlyBlankStarter = currentPerson.rows.length === 1 &&
            !String(currentPerson.rows[0].seconds).trim() &&
            !String(currentPerson.rows[0].fileNumber).trim();
          if (hasOnlyBlankStarter) currentPerson.rows = [];
          imported.forEach(({ file, duration }) => {
            const row = newRow(currentPerson.rows.length + 1);
            row.seconds = editableDuration(duration);
            row.fileNumber = importedFileName(file);
            currentPerson.rows.push(row);
          });
          renumberVideoRows(currentPerson);
          save();
        }
        render();

        const importedSeconds = imported.reduce((sum, item) => sum + Math.round(item.duration), 0);
        const resultMessage = `${imported.length} video${imported.length === 1 ? "" : "s"} added (${friendlyTime(importedSeconds)})` +
          (failed ? `; ${failed} could not be read.` : ".");
        showImportStatus(resultMessage, !imported.length || failed > 0);
      }

      function rowMarkup(person, row, rowIndex) {
        const personName = escapeHtml(person.name || "person");
        return `
          <tr data-row-id="${row.id}">
            <td><input class="cell-input" data-field="videoNumber" type="number" min="0" step="1" inputmode="numeric" value="${escapeHtml(row.videoNumber)}" aria-label="Video number ${rowIndex + 1} for ${personName}"></td>
            <td><input class="cell-input seconds-input" data-field="seconds" type="text" inputmode="text" value="${escapeHtml(row.seconds)}" placeholder="0 or 0:00" aria-label="Seconds or minutes and seconds for row ${rowIndex + 1} of ${personName}"></td>
            <td><input class="cell-input" data-field="fileNumber" type="text" value="${escapeHtml(row.fileNumber)}" placeholder="File no." maxlength="40" aria-label="File number for row ${rowIndex + 1} of ${personName}"></td>
            <td class="row-delete-cell"><button class="delete-row" data-action="delete-row" type="button" title="Delete video row" aria-label="Delete video row ${rowIndex + 1} for ${personName}">&times;</button></td>
          </tr>`;
      }

      function personMarkup(person, index) {
        const seconds = totalSeconds(person);
        const isImporting = importingPeople.has(person.id);
        return `
          <article class="person-panel" data-person-id="${person.id}">
            <div class="person-toolbar">
              <input class="name-input" data-person-field="name" value="${escapeHtml(person.name)}" maxlength="60" aria-label="Name for person ${index + 1}">
              <button class="icon-button import-folder${isImporting ? " is-loading" : ""}" data-action="import-folder" type="button" title="Import videos from a folder" aria-label="Import videos from a folder for ${escapeHtml(person.name)}" ${isImporting ? "disabled" : ""}>&#128193;</button>
              <button class="icon-button" data-action="add-row" type="button" title="Add video row" aria-label="Add video row">+</button>
              <button class="icon-button delete-person" data-action="delete-person" type="button" title="Remove person" aria-label="Remove ${escapeHtml(person.name)}">&times;</button>
            </div>
            <div class="table-wrap">
              <table>
                <colgroup><col class="video-col"><col class="seconds-col"><col class="file-col"><col class="delete-col"></colgroup>
                <thead><tr><th>No. of Videos</th><th>Minutes:Seconds</th><th>File Number</th><th class="action-heading" aria-label="Row actions"></th></tr></thead>
