                <tbody>${person.rows.map((row, rowIndex) => rowMarkup(person, row, rowIndex)).join("")}</tbody>
              </table>
            </div>
            <footer class="panel-footer">
              <div>
                <span class="panel-footer-label">Total Time</span>
                <span class="panel-footer-detail">${friendlyTime(seconds)}</span>
              </div>
              <div class="person-total">${clockTime(seconds)} <span>MIN:SEC</span></div>
              <div class="target-slot">${targetMarkup(seconds)}</div>
            </footer>
          </article>`;
      }

      function notesMarkup() {
        return `
          <div class="sidebar-stack">
            <aside class="notes-panel" aria-label="Notes">
              <h2 class="notes-heading"><span class="notes-heading-icon" aria-hidden="true">#</span> Notes</h2>
              <div class="folder-instruction">
                <span class="folder-instruction-icon" aria-hidden="true">&#128193;</span>
                <span>Click the folder icon beside a person to calculate all videos in a folder.</span>
              </div>
              <div class="notes-shortcuts" aria-label="Keyboard shortcuts">
                <kbd>Ctrl+Z</kbd><span>Undo</span>
                <span class="shortcut-divider" aria-hidden="true">&bull;</span>
                <kbd>Ctrl+Shift+Z</kbd><span>Redo</span>
              </div>
              <textarea class="notes-input" id="notesInput" placeholder="Write your notes here..." aria-label="Notes">${escapeHtml(notes)}</textarea>
            </aside>
            <section class="preset-panel" aria-labelledby="presetHeading">
              <h2 class="preset-heading" id="presetHeading"><span class="preset-heading-icon" aria-hidden="true">&#128203;</span> Copy preset</h2>
              <textarea class="preset-input" id="presetInput" aria-label="Copy preset">${escapeHtml(preset)}</textarea>
              <div class="preset-actions">
                <button class="copy-button" data-action="copy-preset" type="button">Copy to clipboard</button>
                <span class="copy-status" id="copyStatus" role="status" aria-live="polite"></span>
              </div>
            </section>
          </div>`;
      }

      function captureScrollState() {
        const panelScroll = new Map();
        grid.querySelectorAll(".person-panel").forEach((panel) => {
          const personId = panel.dataset.personId;
          const scroller = panel.querySelector(".table-wrap");
          if (personId && scroller) panelScroll.set(personId, scroller.scrollTop);
        });

        return {
          worksheetLeft: worksheet.scrollLeft,
          panelScroll,
          notesTop: grid.querySelector("#notesInput")?.scrollTop ?? 0,
          presetTop: grid.querySelector("#presetInput")?.scrollTop ?? 0
        };
      }

      function restoreScrollState(scrollState) {
        worksheet.scrollLeft = scrollState.worksheetLeft;

        scrollState.panelScroll.forEach((scrollTop, personId) => {
          const panel = grid.querySelector(`[data-person-id="${personId}"]`);
          const scroller = panel?.querySelector(".table-wrap");
          if (scroller) scroller.scrollTop = scrollTop;
        });

        const notesInput = grid.querySelector("#notesInput");
        const presetInput = grid.querySelector("#presetInput");
        if (notesInput) notesInput.scrollTop = scrollState.notesTop;
        if (presetInput) presetInput.scrollTop = scrollState.presetTop;
      }

      function syncKnownPersonTotals() {
        const activePersonIds = new Set();
        people.forEach((person) => {
          activePersonIds.add(person.id);
          knownPersonTotals.set(person.id, totalSeconds(person));
        });

        knownPersonTotals.forEach((_, personId) => {
          if (!activePersonIds.has(personId)) knownPersonTotals.delete(personId);
        });
      }

      function render() {
        const scrollState = captureScrollState();
        let content;
        if (!people.length) {
          content = `<div class="empty-state"><div><strong>No people in this sheet</strong>Add a person to begin.</div></div>`;
        } else {
          content = people.map(personMarkup).join("");
        }
        grid.innerHTML = content + notesMarkup();
        grid.querySelectorAll(".seconds-input").forEach(applyDurationValidity);
        updateCombinedTotal();
        restoreScrollState(scrollState);
        syncKnownPersonTotals();
      }

      function updateCombinedTotal() {
        const seconds = people.reduce((sum, person) => sum + totalSeconds(person), 0);
        const rows = people.reduce((sum, person) => sum + person.rows.length, 0);
        combinedTime.textContent = friendlyTime(seconds);
        combinedMeta.textContent = `${seconds} ${seconds === 1 ? "second" : "seconds"} across ${rows} video ${rows === 1 ? "row" : "rows"}`;
      }

      function findPerson(element) {
        const id = element.closest("[data-person-id]")?.dataset.personId;
        return people.find((person) => person.id === id);
      }

      function findRow(person, element) {
        const id = element.closest("[data-row-id]")?.dataset.rowId;
        return person?.rows.find((row) => row.id === id);
      }

      function nextVideoNumber(person) {
        return person.rows.length + 1;
      }

      function renumberVideoRows(person) {
        person.rows.forEach((row, index) => {
          row.videoNumber = index + 1;
        });
      }

      async function copyPreset() {
        const input = grid.querySelector("#presetInput");
        const status = grid.querySelector("#copyStatus");
        if (!input || !status) return;

        try {
          if (!navigator.clipboard?.writeText) throw new Error("Clipboard API unavailable");
          await navigator.clipboard.writeText(input.value);
          status.textContent = "Copied!";
        } catch (_) {
          input.focus();
          input.select();
          status.textContent = document.execCommand("copy") ? "Copied!" : "Copy failed";
        }

        window.setTimeout(() => {
          if (status.isConnected) status.textContent = "";
        }, 1800);
      }

      grid.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;

        if (button.dataset.action === "copy-preset") {
          copyPreset();
          return;
        }

        const person = findPerson(button);
        if (!person) return;

        if (button.dataset.action === "import-folder") {
          importPersonId = person.id;
          folderInput.value = "";
          folderInput.click();
          return;
        }

        if (button.dataset.action === "delete-row") {
          const row = findRow(person, button);
          if (!row) return;
          recordCurrentState();
          person.rows = person.rows.filter((item) => item.id !== row.id);
          renumberVideoRows(person);
          save();
          render();
          return;
        }

        if (button.dataset.action === "add-row") {
          recordCurrentState();
          const row = newRow(nextVideoNumber(person));
          person.rows.push(row);
          save();
          render();
          requestAnimationFrame(() => {
            const panel = grid.querySelector(`[data-person-id="${person.id}"]`);
            panel?.querySelector(`[data-row-id="${row.id}"] [data-field="seconds"]`)?.focus();
            const scroller = panel?.querySelector(".table-wrap");
            if (scroller) scroller.scrollTop = scroller.scrollHeight;
          });
        }

        if (button.dataset.action === "delete-person") {
          recordCurrentState();
          people = people.filter((item) => item.id !== person.id);
          save();
          render();
        }
      });

      folderInput.addEventListener("change", () => {
        const personId = importPersonId;
        const files = Array.from(folderInput.files || []);
        importPersonId = null;
        if (personId && files.length) importFolder(personId, files);
      });

      grid.addEventListener("submit", (event) => {
        if (!event.target.matches(".target-form")) return;
        event.preventDefault();
        setTarget(event.target);
      });

      grid.addEventListener("input", (event) => {
        if (event.target.matches(".target-input")) {
          event.target.setCustomValidity("");
          return;
        }

        if (event.target.id === "notesInput") {
          notes = event.target.value;
          localStorage.setItem(NOTES_STORAGE_KEY, notes);
          return;
        }

        if (event.target.id === "presetInput") {
          preset = event.target.value;
          if (preset.trim()) {
            localStorage.setItem(PRESET_STORAGE_KEY, preset);
          } else {
            localStorage.removeItem(PRESET_STORAGE_KEY);
          }
          return;
        }

        const person = findPerson(event.target);
        if (!person) return;

        if (event.target.dataset.personField === "name") {
          person.name = event.target.value;
          save();
          return;
        }

        const field = event.target.dataset.field;
        const row = findRow(person, event.target);
        if (!field || !row) return;
        row[field] = event.target.value;
        save();

        if (field === "seconds") {
          applyDurationValidity(event.target);
          const seconds = totalSeconds(person);
          const previousSeconds = knownPersonTotals.get(person.id) ?? seconds;
          knownPersonTotals.set(person.id, seconds);
          const panel = event.target.closest(".person-panel");
          panel.querySelector(".panel-footer-detail").textContent = friendlyTime(seconds);
          panel.querySelector(".person-total").innerHTML = `${clockTime(seconds)} <span>MIN:SEC</span>`;
          panel.querySelector(".target-slot").innerHTML = targetMarkup(seconds);
          updateCombinedTotal();

          if (targetSeconds && previousSeconds < targetSeconds && seconds >= targetSeconds) {
            celebrateTarget(person, panel);
          }
        }
      });

      grid.addEventListener("focusin", (event) => {
        if (event.target.matches("input, textarea")) {
          editStartSnapshot = stateSnapshot();
        }
      });

      grid.addEventListener("change", (event) => {
        if (event.target.matches(".seconds-input") && !applyDurationValidity(event.target)) {
          historyStatus.textContent = event.target.validationMessage;
          event.target.reportValidity();
        }
        if (!event.target.matches("input, textarea") || !editStartSnapshot) return;
        if (editStartSnapshot !== stateSnapshot()) {
          pushUndoSnapshot(editStartSnapshot);
        }
      });

      grid.addEventListener("focusout", (event) => {
        if (event.target.matches("input, textarea")) {
          editStartSnapshot = null;
        }
      });

      grid.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || event.target.dataset.field !== "seconds") return;
        event.preventDefault();
        const person = findPerson(event.target);
        if (!person) return;
        const currentRow = findRow(person, event.target);
        const currentIndex = person.rows.indexOf(currentRow);
        const nextRow = person.rows[currentIndex + 1];
        if (nextRow) {
          grid.querySelector(`[data-row-id="${nextRow.id}"] [data-field="seconds"]`)?.focus();
        } else {
          event.target.closest(".person-panel").querySelector('[data-action="add-row"]')?.click();
        }
      });

      addPersonButton.addEventListener("click", () => {
        recordCurrentState();
        const person = newPerson(people.length + 1);
        people.push(person);
        save();
        render();
        requestAnimationFrame(() => {
          worksheet.scrollTo({ left: worksheet.scrollWidth, behavior: "smooth" });
          grid.querySelector(`[data-person-id="${person.id}"] .name-input`)?.select();
        });
      });

      [worksheetTab, countdownTab].forEach((tab) => {
        tab.addEventListener("click", () => selectTab(tab));
        tab.addEventListener("keydown", (event) => {
          if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
          event.preventDefault();
          const nextTab = event.key === "Home" || event.key === "ArrowLeft" ? worksheetTab : countdownTab;
          selectTab(nextTab);
          nextTab.focus();
        });
      });

      document.querySelectorAll("[data-countdown-seconds]").forEach((button) => {
        button.addEventListener("click", () => {
          countdownSecondsInput.value = button.dataset.countdownSeconds;
          countdownRemaining = Number(button.dataset.countdownSeconds);
          countdownStarted = false;
          countdownStatus.textContent = "Ready";
          updateCountdownDisplay();
        });
      });

      countdownSecondsInput.addEventListener("input", () => {
        countdownSecondsInput.setCustomValidity("");
        const requested = Math.round(Number(countdownSecondsInput.value));
        if (Number.isFinite(requested) && requested >= 1 && requested <= 1200) {
          countdownRemaining = requested;
          countdownStarted = false;
          updateCountdownDisplay();
        }
      });

      countdownSecondsInput.addEventListener("change", () => {
        const requested = Math.round(Number(countdownSecondsInput.value));
        countdownRemaining = Number.isFinite(requested) ? Math.max(1, Math.min(1200, requested)) : 60;
        countdownSecondsInput.value = countdownRemaining;
        countdownStarted = false;
        updateCountdownDisplay();
      });

      countdownStart.addEventListener("click", startCountdown);
      countdownPause.addEventListener("click", pauseCountdown);
      countdownReset.addEventListener("click", resetCountdown);
      countdownLogExport.addEventListener("click", exportCountdownLogToTimeSheet);
      countdownLogClear.addEventListener("click", clearCountdownLog);

      countdownLogList.addEventListener("input", (event) => {
        if (event.target.matches(".countdown-log-input")) event.target.setCustomValidity("");
      });

      countdownLogList.addEventListener("change", (event) => {
        if (!event.target.matches(".countdown-log-input")) return;
        const row = event.target.closest("[data-log-id]");
        const entry = countdownLog.find((item) => item.id === row?.dataset.logId);
        if (!entry) return;
        const error = durationError(event.target.value);
        if (error) {
          event.target.setCustomValidity(error);
          event.target.reportValidity();
          return;
        }
        entry.seconds = Math.round(parseDuration(event.target.value));
        saveCountdownLog();
        renderCountdownLog();
      });

      countdownLogList.addEventListener("click", (event) => {
        const button = event.target.closest(".countdown-log-delete");
        if (!button) return;
        const id = button.closest("[data-log-id]")?.dataset.logId;
        countdownLog = countdownLog.filter((entry) => entry.id !== id);
        saveCountdownLog();
        renderCountdownLog();
      });

      voiceEnabled.addEventListener("change", () => {
        if (!voiceEnabled.checked) window.speechSynthesis?.cancel();
        else if (countdownRunning && countdownRemaining > 0) speakCountdown(countdownRemaining);
      });

      if (!("speechSynthesis" in window)) {
        voiceEnabled.checked = false;
        voiceEnabled.disabled = true;
        voiceEnabled.parentElement.title = "Voice countdown is not supported by this browser.";
      }

      document.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button || button.disabled) return;
        playButtonSound(button.dataset.action || button.id);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key.toLowerCase() !== "c" || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.target.matches("input, textarea, select, [contenteditable='true']")) return;
        if (!countdownHotkeyEnabled.checked) return;

        event.preventDefault();
        selectTab(countdownTab);
        if (countdownRunning) stopCountdownAndReport();
        else startCountdown();
      });

      document.addEventListener("keydown", (event) => {
        if ((!event.ctrlKey && !event.metaKey) || event.altKey) return;
        if (event.target.matches("input, textarea, [contenteditable='true']")) return;

        const key = event.key.toLowerCase();
        const isUndo = key === "z" && !event.shiftKey;
        const isRedo = key === "y" || (key === "z" && event.shiftKey);
        if (!isUndo && !isRedo) return;

        const handled = isUndo ? undo() : redo();
        if (handled) event.preventDefault();
      });

      render();
      renderCountdownLog();
      if (window.location.hash === "#countdown") selectTab(countdownTab);
    })();
  </script>
</body>
</html>
